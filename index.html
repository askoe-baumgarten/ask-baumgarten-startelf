<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ASK Baumgarten | Startelf</title><style>body{margin:0;background:#141216;color:#fff;font:15px system-ui}.wrap{max-width:1200px;margin:auto;padding:18px;display:grid;grid-template-columns:370px 1fr;gap:22px}.box{background:#252229;border-radius:14px;padding:20px}h1{color:#ff3659}h2{margin-top:24px}label{display:block;margin-top:10px}input,select{width:100%;padding:9px;margin-top:4px;box-sizing:border-box;border-radius:5px;border:0}button{background:#d90036;color:white;border:0;border-radius:7px;padding:12px;margin:8px 4px 0 0;cursor:pointer}canvas{width:100%;max-width:550px;display:block;margin:auto}.row{display:grid;grid-template-columns:25px 1fr;gap:6px;align-items:center;margin:5px 0}.note{color:#bbb;font-size:12px}@media(max-width:800px){.wrap{display:block}.box{margin-bottom:15px}}</style><div class="wrap"><section class="box"><h1>🔴⚪ ASK Baumgarten</h1><p>Startelf-Generator · GitHub-Version</p><h2>Spiel</h2><label>Gegner<select id="saved"><option value="">Neuen Gegner eingeben</option></select></label><label>Gegnername<input id="opp" value="UFC Neckenmarkt"></label><label>Datum<input id="date" type="date" value="2026-10-30"></label><label>Anstoß<input id="time" type="time" value="19:30"></label><label>Spielort<select id="venue"><option>Heimspiel</option><option>Auswärtsspiel</option></select></label><label>Gegnerlogo hochladen<input id="logo" type="file" accept="image/*"></label><button id="save">Gegner und Logo speichern</button><button id="remove">Gegner löschen</button><p class="note">Eigene Logos bleiben zunächst im jeweiligen Browser. Gemeinsame Logos können später als Dateien im Repository ergänzt werden.</p><button id="export">Gegner exportieren</button><label>Gegner importieren<input id="import" type="file" accept=".json"></label><h2>Startelf</h2><div id="starters"></div><h2>Ersatzspieler</h2><div id="subs"></div><h2>Trainer</h2> const $=id=>document.getElementById(id),canvas=$('canvas'),c=canvas.getContext('2d');let db=JSON.parse(localStorage.getItem('ask-opponents-v4')||'{}'),logo=null;function row(target,count,klass){for(let i=0;i<count;i++){let d=document.createElement('div');d.className='row';let s=document.createElement('select');s.className=klass;s.innerHTML='<option value="">— auswählen —</option>'+players.map((p,j)=>'<option value="'+j+'">'+p[1]+' · '+p[0]+'</option>').join('');let n=document.createElement('span');n.textContent=i+1;d.append(n,s);$(target).append(d);s.onchange=draw}}row('starters',11,'start');row('subs',7,'sub');
function t(s,x,y,size=28,color='#fff',weight=700){c.fillStyle=color;c.font=weight+' '+size+'px system-ui';c.fillText(s,x,y)}function fit(s,x,y,max,size,color='#fff'){while(size>15){c.font='800 '+size+'px system-ui';if(c.measureText(s).width<=max)break;size--}t(s,x,y,size,color,800)}function bar(x,y,w,h,color){c.fillStyle=color;c.fillRect(x,y,w,h)}function draw(){let g=c.createLinearGradient(0,0,1080,1350);g.addColorStop(0,'#3c0818');g.addColorStop(.5,'#130e14');g.addColorStop(1,'#09090c');c.fillStyle=g;c.fillRect(0,0,1080,1350);for(let i=0;i<22;i++){c.strokeStyle='rgba(240,20,65,.08)';c.lineWidth=15;c.beginPath();c.moveTo(i*90-200,0);c.lineTo(i*90+300,1350);c.stroke()}bar(0,0,1080,14,'#e4003c');t('SPIELTAG',55,125,92);bar(58,148,430,8,'#e4003c');t('ASK BAUMGARTEN',58,220,39);t('MEISTERSCHAFT',58,275,23,'#ff4d73');fit('VS. '+$('opp').value.toUpperCase(),58,325,710,35);t(($('date').value||'').split('-').reverse().join('.')+'  |  '+$('time').value+' UHR',58,370,28);t($('venue').value.toUpperCase(),58,414,26,'#ff4d73');if(logo){c.save();c.beginPath();c.arc(935,220,92,0,Math.PI*2);c.clip();c.fillStyle='#fff';c.fillRect(843,128,184,184);c.drawImage(logo,850,135,170,170);c.restore()}bar(54,455,972,4,'#e4003c');t('START',56,530,82);t('ELF',337,530,82,'#ff355c');let ss=[...document.querySelectorAll('.start')];ss.forEach((s,i)=>{let y=556+i*62;bar(55,y,575,53,'#f1eeee');bar(55,y,83,53,'#d60038');let p=players[+s.value];if(s.value==='')p=null;t(p?String(p[1]):'—',77,y+37,30);fit(p?p[0].toUpperCase():'SPIELER '+(i+1),156,y+37,450,29,'#171319')});bar(673,550,3,630,'#f0355b');t('ERSATZSPIELER',700,850,30,'#ff355c');[...document.querySelectorAll('.sub')].forEach((s,i)=>{let p=s.value===''?null:players[+s.value],y=892+i*39;bar(701,y+7,324,1,'#6a3444');fit(p?p[1]+'  '+p[0].toUpperCase():'',707,y,312,20)});t('TRAINER',700,1200,30,'#ff355c');fit($('coach').value.toUpperCase(),700,1238,320,26);bar(54,1285,972,3,'#e4003c');t('TRADITION  |  LEIDENSCHAFT  |  ZUSAMMENHALT',240,1320,20)}function opts(){let sel=$('saved'),old=sel.value;sel.innerHTML='<option value="">Neuen Gegner eingeben</option>';Object.keys(db).sort().forEach(n=>sel.add(new Option(n,n)));sel.value=db[old]?old:''}function pick(n){if(!db[n])return;$('opp').value=n;logo=null;if(db[n].logo){let im=new Image();im.onload=()=>{logo=im;draw()};im.src=db[n].logo}else draw()}$('saved').onchange=e=>pick(e.target.value);$('logo').onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{let im=new Image();im.onload=()=>{logo=im;draw()};im.src=r.result};r.readAsDataURL(f)};$('save').onclick=()=>{let n=$('opp').value.trim();if(!n)return;db[n]={logo:logo?.src||db[n]?.logo||null};try{localStorage.setItem('ask-opponents-v4',JSON.stringify(db));opts();$('saved').value=n;alert('Gegner gespeichert')}catch(e){alert('Speicher voll: bitte kleineres Logo verwenden')}};$('remove').onclick=()=>{delete db[$('saved').value];localStorage.setItem('ask-opponents-v4',JSON.stringify(db));opts();logo=null;draw()};function dl(name,data,type){let a=document.createElement('a'),url=URL.createObjectURL(new Blob([data],{type}));a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}$('export').onclick=()=>dl('ASK_Gegner.json',JSON.stringify(db,null,2),'application/json');$('import').onchange=async e=>{try{Object.assign(db,JSON.parse(await e.target.files[0].text()));localStorage.setItem('ask-opponents-v4',JSON.stringify(db));opts();alert('Import erfolgreich')}catch(e){alert('Ungültige Datei')}};$('download').onclick=()=>{draw();let a=document.createElement('a');a.download='ASK_Baumgarten_Startelf.png';a.href=canvas.toDataURL('image/png');a.click()};document.querySelectorAll('input,select').forEach(el=>el.addEventListener('change',draw));opts();draw();</script></html>
