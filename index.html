let shared={};
async function loadShared(){try{let res=await fetch('gegnerlogos.json?ts='+Date.now(),{cache:'no-store'});if(!res.ok)throw Error('HTTP '+res.status);let data=await res.json();shared=data.gegner||{};opts()}catch(err){console.warn('Gemeinsame Gegnerlogos nicht geladen:',err)}}
function opts(){let sel=$('saved'),old=sel.value;sel.innerHTML='<option value="">Neuen Gegner eingeben</option>';[...new Set([...Object.keys(shared),...Object.keys(db)])].sort((a,b)=>a.localeCompare(b,'de')).forEach(n=>sel.add(new Option(n+(shared[n]?' ★':''),n)));sel.value=(db[old]||shared[old])?old:''}
function pick(n){if(!n)return;$('opp').value=n;logo=null;let path=shared[n]||db[n]?.logo;if(path){let im=new Image();im.onload=()=>{logo=im;draw()};im.onerror=()=>{logo=null;draw();console.warn('Gegnerlogo nicht gefunden:',path)};im.src=path}else draw()}
$('saved').onchange=e=>pick(e.target.value);
$('logo').onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{let im=new Image();im.onload=()=>{logo=im;draw()};im.src=r.result};r.readAsDataURL(f)};
$('save').onclick=()=>{let n=$('opp').value.trim();if(!n)return;let src=logo?.src;if(src&&!src.startsWith('data:'))src=db[n]?.logo||null;db[n]={logo:src||db[n]?.logo||null};try{localStorage.setItem('ask-opponents-v4',JSON.stringify(db));opts();$('saved').value=n;alert('Gegner lokal gespeichert. Für alle Geräte muss das Logo zusätzlich auf GitHub hinterlegt werden.')}catch(e){alert('Speicher voll: bitte kleineres Logo verwenden')}};
$('remove').onclick=()=>{let n=$('saved').value;delete db[n];localStorage.setItem('ask-opponents-v4',JSON.stringify(db));opts();logo=null;draw();if(shared[n])alert('Der gemeinsame Gegner bleibt verfügbar. Zum Entfernen muss gegnerlogos.json auf GitHub geändert werden.')};
function dl(name,data,type){let a=document.createElement('a'),url=URL.createObjectURL(new Blob([data],{type}));a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}$('export').onclick=()=>dl('ASK_Gegner.json',JSON.stringify(db,null,2),'application/json');$('import').onchange=async e=>{try{Object.assign(db,JSON.parse(await e.target.files[0].text()));localStorage.setItem('ask-opponents-v4',JSON.stringify(db));opts();alert('Import erfolgreich')}catch(e){alert('Ungültige Datei')}};$('download').onclick=()=>{draw();let a=document.createElement('a');a.download='ASK_Baumgarten_Startelf.png';a.href=canvas.toDataURL('image/png');a.click()};document.querySelectorAll('input,select').forEach(el=>{el.addEventListener('change',draw);el.addEventListener('input',draw)});opts();draw();loadShared();</script></html>
